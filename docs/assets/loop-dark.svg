<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">How the 4x loop works</title>
<desc id="desc">Designer, Coder, Reviewer, Tester, Accept, Pending Review, Done. A Reviewer FAIL or a failing test sends the code to amending, which goes back to the Reviewer. Escalations route back to the Designer. A human signs off before Done.</desc>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.cap{font-size:13px;letter-spacing:1.2px;font-weight:600}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#8B949E"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#BC8CFF"/></marker></defs>
<rect width="1100" height="330" fill="#0D1117"/>
<rect x="36" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="36" y="70" width="5" height="64" rx="2" fill="#BC8CFF"/>
<text x="102.0" y="108" class="sans b" fill="#BC8CFF" font-size="15" text-anchor="middle">Designer</text>
<rect x="186" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="186" y="70" width="5" height="64" rx="2" fill="#56D4DD"/>
<text x="252.0" y="108" class="sans b" fill="#56D4DD" font-size="15" text-anchor="middle">Coder</text>
<rect x="336" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="336" y="70" width="5" height="64" rx="2" fill="#56D364"/>
<text x="402.0" y="108" class="sans b" fill="#56D364" font-size="15" text-anchor="middle">Reviewer</text>
<rect x="486" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="486" y="70" width="5" height="64" rx="2" fill="#FFA657"/>
<text x="552.0" y="108" class="sans b" fill="#FFA657" font-size="15" text-anchor="middle">Tester</text>
<rect x="636" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="636" y="70" width="5" height="64" rx="2" fill="#E3B341"/>
<text x="702.0" y="108" class="sans b" fill="#E3B341" font-size="15" text-anchor="middle">Accept</text>
<rect x="786" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="786" y="70" width="5" height="64" rx="2" fill="#8B949E"/>
<text x="852.0" y="108" class="sans b" fill="#E6EDF3" font-size="14" text-anchor="middle">Pending Review</text>
<rect x="936" y="70" width="128" height="64" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect x="936" y="70" width="5" height="64" rx="2" fill="#56D364"/>
<text x="1002.0" y="108" class="sans b" fill="#56D364" font-size="15" text-anchor="middle">Done</text>
<text x="36" y="40" class="sans cap" fill="#8B949E" font-size="13" text-anchor="start">ROLES RUN ISOLATED, IN ORDER</text>
<path d="M164,102.0 L184,102.0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M314,102.0 L334,102.0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M464,102.0 L484,102.0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M614,102.0 L634,102.0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
