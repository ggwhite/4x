<path d="M914,102.0 L934,102.0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="410.0" y="214" width="150" height="52" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="485.0" y="246" class="mono b" fill="#E6EDF3" font-size="15" text-anchor="middle">amending</text>
<path d="M380.0,134 L380.0,240 L408.0,240" fill="none" stroke="#BC8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="374.0" y="168" class="mono" fill="#BC8CFF" font-size="12" text-anchor="end">FAIL</text>
<path d="M550.0,134 L550.0,240 L562.0,240" fill="none" stroke="#BC8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aha)"/>
<text x="556.0" y="168" class="mono" fill="#BC8CFF" font-size="12" text-anchor="start">verify failed</text>
<path d="M440.0,214 L440.0,136" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="446.0" y="196" class="sans" fill="#8B949E" font-size="12" text-anchor="start">re-review</text>
<path d="M485.0,266 L485.0,294 L100.0,294 L100.0,136" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="110.0" y="286" class="sans" fill="#8B949E" font-size="12" text-anchor="start">escalation → Designer (spec-mismatch, criteria-wrong)</text>
<path d="M1000.0,204 L1000.0,136" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="1000.0" y="224" class="sans b" fill="#E6EDF3" font-size="13" text-anchor="middle">human sign-off</text>
<text x="1000.0" y="242" class="mono" fill="#8B949E" font-size="12" text-anchor="middle">4x done</text>
<text x="1064" y="316" class="sans" fill="#8B949E" font-size="13" text-anchor="end">Round budget (default 5) stops endless amend loops.</text>
