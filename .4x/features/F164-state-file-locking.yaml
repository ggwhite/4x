id: F164-state-file-locking
name: 'F164: State 檔案並發鎖'
description: |-
    現狀：state.json 等 .4x 檔案的 read-modify-write 沒有跨程序鎖，batch/parallel 模式、dashboard 的 POST /api/done 與進行中的 4x run 可能同時寫入互相覆寫，造成 state 遺失或損毀。

    需求：
    - protocol 層 state 寫入加跨程序 file lock（flock 或 lock file），read-modify-write 原子化
    - 涵蓋 orchestrator、CLI 命令（done/retry/abandon 等）、server handlers 共用的所有寫入路徑，收斂到單一加鎖的寫入 helper
    - 取鎖等待設逾時，逾時回明確錯誤而非無限 hang

    約束：
    - 只鎖寫入，讀取不加鎖（維持 dashboard 高頻輪詢效能；配合原子寫入 rename 保證讀到完整檔）
    - 不引入外部依賴（syscall flock 或 O_EXCL lock file）
    - 單程序內既有行為與效能不可退化
status: not-started
priority: 2
profile: normal
subtasks:
    - id: lock-primitive
      name: 跨程序鎖原語與單元測試
      status: ""
    - id: write-path-integration
      name: 所有 state 寫入路徑收斂接鎖
      status: ""
    - id: timeout-error
      name: 逾時與錯誤處理
      status: ""
rules:
    - '來源: docs/reference/independent-analysis.md Security Assessment #7'
