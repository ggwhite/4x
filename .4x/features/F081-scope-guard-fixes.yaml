      name: mono/multiRepo.DetectChangedRepos 加入 git ls-files --others --exclude-standard 偵測 untracked files
      status: ""
    - id: yaml-load-fail
      name: checkScope 在 YAML 載入失敗時設 Pass=false 而非只 warn
      status: ""
    - id: root-level-files
      name: detectChangedRepos 過濾根目錄檔案（無 / 分隔符的路徑）
      status: ""
    - id: deep-review-guard
      name: needsDesignOutputs map 加入 PhaseDeepReviewing
      status: ""
