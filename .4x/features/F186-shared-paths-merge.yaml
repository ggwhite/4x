id: F186-shared-paths-merge
name: 'F186: shared_paths 改動在 worktree 清理時靜默遺失'
description: |
    ## 現狀

    F181 為 feature YAML 加了 `shared_paths` 欄位（宣告 Coder 額外可改的根層共用檔案），
    但只做到「宣告 + 驗證 + prompt 渲染」，**完全沒有 merge 或 sync 邏輯**。
    `SharedPaths` 在程式碼只出現 6 處：`internal/feature/types.go:73`（欄位）、
    `internal/feature/validate.go:137`（路徑合法性）、`internal/feature/clone.go:18`（深拷貝）、
    `internal/guard/check.go:75`（guard 驗證）、`internal/guard/designer_yaml.go:74`（註解）、
    `templates/coder.md.tmpl:123`（prompt 渲染）。

    後果鏈：`internal/gitops/multirepo.go:88` 的 `copyWorkspaceFiles` 用 `copyFileIfExists`
    把根層檔案「複製」進 worktree（**不是 git worktree，是純檔案副本**）→ Coder 依 prompt 授權
    改了副本 → `Merge()`（multirepo.go:169）只迭代 `cfg.Workspace.Repos`，
    `PushAndOpenMR()` 只迭代 `m.targetRepos(feat.Repos)` → 最後 `m.Cleanup(featureID)` 刪掉整個
    worktree 目錄 → **那些改動連同 worktree 一起消失，零警告、零 exit code 異常**，
    acceptor 卻仍依 worktree 當下狀態判該 AC PASS。

    另有第二個缺陷：`copyWorkspaceFiles` 有 `if e.IsDir() { continue }`，**只複製檔案、跳過目錄**。
    所以 shared_paths 宣告目錄下的路徑（如 `docker/compose.yml`）時，檔案根本沒被複製進 worktree，
    Coder 面對的是一個不存在的檔案。

    反向也沒防護：worktree 根層的改動流進主工作區污染別的 feature，同樣無 guard。

    ## 證據來源

    由 Kairos 專案（~/Tyche/Kairos，multi-repo workspace，318 feature / 298 done）的 4x audit 回報，
    並在本 repo 逐行核對屬實。實際損害：5 款遊戲的 docker-compose service 靜默遺失，
    2026-08-21 用 commit `c4f2d8b` 手動 backfill（baseball / bulllook / honorking / mjhl /
    serialtreasures）；累積約 15 個手動補救 commit；跨 ws-140 / 291 / 297 / 298 / 300 / 303
    被報過 6 次。

    ## 需求

    1. **偵測並中止**（最低防線）：`Merge()` 與 `PushAndOpenMR()` 執行前，比對 worktree 根層
       shared_paths 檔案與主工作區對應檔案；有差異且未被下一項處理時中止並報錯，不得靜默丟棄。
    2. **合併回主工作區**：把 worktree 根層 shared_paths 檔案的改動複製回主工作區，
       納入本次 squash commit（MR 流程則納入對應 repo 的 commit 或明確報告無法納入）。
    3. **修 SetupWorktree 的目錄跳過**：`copyWorkspaceFiles` 對 shared_paths 宣告的路徑，
       即使位於目錄下也要複製進 worktree（建立必要的中間目錄）。
    4. **反向污染防護**：`4x check` 加一條，宣告 shared_paths 的 feature 執行期間，
       主工作區對應檔案須與 HEAD 一致。
    5. **測試 fixture**：4x 自身是 single repo，此缺陷只在 multi-repo workspace 觸發。
       須建 multi-repo workspace 測試 fixture 端到端驗證 shared_paths 改動存活過 done。

    ## 約束

    - 不改變 `hub_repos` / `RepoConfig.Hub` / `checkScope` 既有語意
    - 不引入新的外部依賴
    - feature 未宣告 shared_paths 時行為與現況完全一致（零回歸）
    - 不得以「靜默跳過」處理任何無法合併的情況——必須報錯或明確輸出
    ## 前置條件已變更（2026-08-23，第一次嘗試後補充）

    本 feature 第一次嘗試時四輪 design-review 全數 FAIL，根因是設計前提有三處斷點
    而原 scope 只涵蓋最後一處。其中兩處已由後續 feature 解決，重新設計時**必須以
    下列現況為準，不要沿用第一次的假設**：

    - **已解決（F189-designer-sharedpaths-sync）**：`internal/orchestrator/worktree.go`
      的 `SyncFeatureFromWorktree` 現在會合併 `SharedPaths`（原本只合併 `Repos`）。
      Designer 在 worktree 宣告的 `shared_paths` 已能傳回主工作區，
      `sharedPathsFor(ws, featureID)` 讀主工作區 YAML 不再恆為 nil。
    - **已解決（F190-merge-preflight-self-block）**：`internal/gitops/selfmanaged.go`
      的 `commitSelfManaged` 會在兩個 `Merge` 實作的 preflight **之前**，把 4x 自管路徑
      （feature YAML、`learnings.json`、`learnings-context.md`）path-scoped commit 掉。
      本 feature 的 merge-back commit 必須與這個既有機制協調，不可各寫一套。
    - **仍未解決，本 feature 須納入**：見下方需求 6、7。

    ## 需求（第一次嘗試後新增）

    6. **基線取樣時機**（第一次嘗試的 B1）：若設計採用「相對 `SetupWorktree` 當下快照」
       判斷 drift，必須注意 `shared_paths` 的**主要宣告者是 Designer**
       （`templates/designer.md.tmpl:317,326-327`、`internal/guard/designer_yaml.go:74`），
       而 designing phase 在 `SetupWorktree` **之後**（`cmd/4x/run.go:173` setupWorktree
       → `:177` InitFeatureDir → 之後才進 orchestrator loop）。setup 當下 `len(paths)==0`
       是**主要流程**而非邊緣情境；基線若只在該時點寫一次，需求 1 與需求 4 會全程 fail-open。
       不得把這個降級狀態寫成期望行為。
    7. **`force-done` 路徑**（第一次嘗試的 B2）：`cmd/4x/force_done.go:114` 同樣呼叫
       `autoMergeFeature`、同樣使用 `doneResult`，必須納入 scope，否則三種「無法納入 commit」
       的 note 與失敗原因在該路徑上完全不輸出，直接違反本 feature「不得靜默」的約束。
status: ready-for-review
priority: 0
profile: full
subtasks:
    - id: detect-and-abort
      name: Merge/PushAndOpenMR 前偵測 worktree 根層 shared_paths 與主工作區的差異，有差異且未處理即中止並報錯
      status: ""
    - id: merge-back
      name: 把 worktree 根層 shared_paths 檔案的改動複製回主工作區，納入 squash commit
      status: ""
    - id: setup-dir-paths
      name: SetupWorktree 的 copyWorkspaceFiles 支援 shared_paths 宣告的目錄下路徑，不再因 IsDir 跳過而讓 Coder 面對不存在的檔案
      status: ""
    - id: reverse-guard
      name: 4x check 加一條，宣告 shared_paths 的 feature 執行期間主工作區對應檔案須與 HEAD 一致，防反向污染
      status: ""
    - id: multirepo-fixture
      name: 建 multi-repo workspace 測試 fixture，端到端驗證 shared_paths 改動存活過 done
      status: ""
    - id: force-done-coverage
      name: cmd/4x/force_done.go 的 autoMergeFeature 路徑納入 scope，shared_paths 的 merged/notes/error 在該路徑同樣輸出
      status: ""
rules:
    - 不改變 hub_repos / RepoConfig.Hub / checkScope 既有語意
    - 不引入新的外部依賴
    - shared_paths 未宣告時行為與現況完全一致（零回歸）
depends:
    - F189-designer-sharedpaths-sync
