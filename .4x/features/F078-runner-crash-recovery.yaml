id: F078-runner-crash-recovery
name: 'F078: Runner crash recovery'
description: |
    Runner 中途斷線（crash / 網路斷）重啟後，4x run 的 resume 邏輯有三個 bug
    導致 phase 被錯誤重置回 coding，先前 round 的產出被覆蓋或浪費。

    ## Bug 1: smartResumePhase deep-review FAIL 回 PhaseCoding 而非 PhaseAmending
    - 位置：cmd/4x/run.go smartResumePhase() line ~2000
    - 現狀：deep-review-report 存在但 reviewPassed=false 時，回傳 PhaseCoding
    - 問題：應回 PhaseAmending（round 不變，coder 讀 deep-review-report 修），
      回 PhaseCoding 等於開新 round，先前整輪 review/test/deep-review 白跑
    - 修法：return protocol.PhaseAmending, protocol.RoleCoder

    ## Bug 2: smartResumePhase 只在 blocked/needs-attention 觸發
    - 位置：cmd/4x/run.go line ~200
    - 現狀：只有 phase==blocked || phase==needs-attention 才呼叫 smartResumePhase
    - 問題：crash 後 state.json 可能停留在任何 phase（如 deep-reviewing、amending），
      直接 resume 該 phase 看似合理，但搭配 cleanStaleArtifact 會砍掉已完成的 report
    - 建議：非 terminal phase 都跑一次 smartResumePhase 驗證 state 一致性，
      或至少在 cleanStaleArtifact 前檢查 artifact 是否「完整」再決定是否清除

    ## Bug 3: cleanStaleArtifact 無條件刪除當前 phase 的 artifact
    - 位置：cmd/4x/run.go cleanStaleArtifact() line ~1952
    - 現狀：resume 時直接刪除 coder-report.md（若 phase=coding/amending）
    - 問題：若 crash 發生在後續 phase（如 deep-fix），state 被手動或錯誤地設回
      amending/coding 時，已完成的 coder-report 會被誤刪
    - 修法：刪除前檢查 artifact 的 timestamp 或完整性；或改為 rename 備份而非直接刪除

    ## 重現場景（ws-078 實例）
    1. Round 1 完整跑完 coding → reviewing → testing → deep-reviewing
    2. Deep-fix（deep-reviewing 子步驟）執行中 Claude Code 斷線
    3. 重啟 4x run，state.json 記錄的 phase 不明確
    4. smartResumePhase 判定 deep-review FAIL → 回 PhaseCoding（Bug 1）
    5. cleanStaleArtifact 刪掉 round-1 的 coder-report.md（Bug 3）
    6. 整輪從 coding 重跑，先前所有 review/test/deep-review 報告浪費
status: ready-for-review
priority: 1
subtasks:
    - id: fix-smart-resume-deep-review
      name: smartResumePhase deep-review FAIL 回 PhaseAmending
      status: not-started
      description: |
        cmd/4x/run.go smartResumePhase() line ~2000:
        reviewPassed(deep-review-report)==false 時回傳 PhaseAmending 而非 PhaseCoding
    - id: widen-smart-resume-trigger
      name: 擴大 smartResumePhase 觸發條件
      status: not-started
      description: |
        cmd/4x/run.go line ~200: 非 terminal phase 都跑 smartResumePhase
        驗證 state.json 與 artifacts 一致，不只限 blocked/needs-attention
    - id: safe-clean-artifact
      name: cleanStaleArtifact 改為安全清除
      status: not-started
      description: |
        刪除前確認 artifact 確實是半成品（如檔案大小為 0、缺少結尾標記），
        或改為 rename .bak 備份而非直接刪除
    - id: add-tests
      name: 測試 crash recovery 各場景
      status: not-started
      description: |
        測試案例：
        - deep-review FAIL 後 resume → 應到 amending 不是 coding
        - amending 中斷 resume → 不應刪除已完成的 coder-report
        - blocked 狀態 resume → smartResumePhase 正確推斷
