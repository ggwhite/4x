id: F188-verify-command-precheck
name: 'F188: Designer 產出的 verify 指令未經任何可執行性檢查即進入 coding'
description: |
  ## 現狀

  Designer 寫進 `test-strategy.yaml` 的 verify 指令，在進入 coding 前沒有任何可執行性檢查。
  `internal/verify/verify.go:73` 的 `ResolveGroups` 只做結構驗證
  （`verify_groups` 與 `verify_commands` 不可並存、不可兩者皆無），
  不驗指令本身能不能跑。`internal/guard/check.go` 在 designing→coding 轉場也沒有相關 guard。

  結果是 Designer 寫入從沒實跑過的指令，直到 tester 階段才炸，整輪 designer→coder→reviewer→tester
  成本歸零。Kairos 專案跨 ws-107 / 140 / 296 / 303 / 319 出現 5 次，escalation 全歸類
  `criteria-wrong`；ws-303 連續空轉 3 輪、ws-319 連續 2 輪。

  已知失敗樣態：`GOWORK` 相對路徑錯、`buf lint` 路徑錯、`ac_ref` 誤寫成 YAML 陣列、
  e2e 的 `go test -race ./...` 在該情境下永遠不會 exit 0。

  ## 設計難題（必須先裁決）

  designing→coding 轉場時**不能**用「實跑且 exit 0」當判定依據：那個時間點程式碼還沒寫，
  `go test` 必然失敗，`make build` 也可能失敗。所以本 feature 的檢查只能是**靜態的**：
  指令可解析、首個 token 是存在的可執行檔、指令中引用的檔案／目錄路徑存在。
  Designer 端的 dry-run 靠 prompt 約束不可靠，不作為主要防線。

  ## 證據來源

  由 Kairos 專案的 4x audit 回報，並在本 repo 核對 `internal/verify/verify.go` 與
  `internal/guard/check.go` 確認無此檢查。

  ## 需求

  1. **定義邊界**：明確寫下靜態可執行性檢查涵蓋什麼、排除什麼（尤其排除以 exit code 判定），
     並記入 `docs/`。
  2. **實作 precheck**：在 `internal/verify` 實作，涵蓋 `verify_groups`、`verify_commands`
     與 `ac_checks` 三處。
  3. **接上 guard**：designing→coding 轉場執行 precheck，失敗即退回 designing，
     並在 escalation 標明是哪一條指令、失敗原因。
  4. **回歸測試**：涵蓋上述四種已知失敗樣態。

  ## 約束

  - 不得在 designing→coding 轉場實跑會產生副作用的指令
  - 不得以 exit code 非 0 作為判定依據
  - 沿用 `internal/verify` 既有的 shell 控制字元處理（`internal/protocol/config.go:257`），
    不另造一套 parser
  - precheck 失敗訊息須指出是哪一條 verify command 與失敗原因，不可只回 generic error
  ## 實測案例：subtest grep 的假陽性（2026-08-23，F186 第七次 design-review 發現）

  F186 的 test-strategy.yaml 用了一個看似穩健的 ac_checks 模式：先跑測試輸出到 log，
  再 `grep -q -- '--- PASS: TestX'`。註解明寫其用意是防止「`go test -run '^TestX$'`
  在 TestX 不存在時仍 exit 0」讓沒寫的測試偽裝成 PASS。

  **但這個模式本身有兩個假陽性來源，reviewer 已實測確認**：

  1. `--- PASS:` 在 `go test -v` 輸出裡**也會出現在縮排的 subtest 行**，
     grep 不錨定行首就會命中。
  2. 命令寫成 `go test ... > log 2>&1; grep -q ...`，那個 `;` **丟棄了 go test 的
     exit code**。

  合起來的後果：parent test FAIL、只要有任一 subtest PASS，該 ac_check 仍 exit 0。
  F186 有 7 條以具名 subtest 當覆蓋單位的 AC 因此形同虛設。

  **這不是 F186 專屬問題**——任何 feature 的 designer 都可能寫出同樣的 ac_checks，
  而現行流程沒有任何一關會發現。本 feature 的 precheck 應把這類「命令寫得出來、
  跑得動，但語意上驗不到東西」的樣態納入檢查範圍，至少涵蓋：

  - grep pattern 未錨定行首而可能命中 subtest 行
  - 用 `;` 串接導致前段命令的 exit code 被丟棄（相對於 `&&`）
  ## Kairos 實測補充（2026-08-23）：pipe 形式與前綴同名

  Kairos 掃了自己的 `.4x/run/*/test-strategy.yaml`，**21 筆中招**
  （ws-231-daily-profit-gain-jackpot 19 筆、ws-292-carroom 1 筆），
  但串接方式與本 repo 觀察到的不同——**不是 `;`，是 pipe**：

      cd kairos-core && go test -race -count=1 -v -run 'TestProfitGainEnums' ./model/enums/ 2>&1 | grep -q -- '--- PASS: TestProfitGainEnums'

  後果一樣：pipeline 的 exit code 取自最後一個指令（grep），`go test` 的失敗被吃掉。
  **precheck 必須同時涵蓋 `;` 與 `|` 兩種形式**，只擋分號會漏掉這 21 筆這種寫法。

  另外這批的 grep pattern 沒有尾隨空白（`'--- PASS: TestProfitGainEnums'`），
  除了會命中縮排 subtest，還會被 **`TestProfitGainEnumsExtra` 這類前綴同名的另一個測試**命中。
  正解 `'^--- PASS: TestX '`（錨行首 + 尾隨空白）兩個問題一起解，已在 F186 第八輪
  design-review 實證採用。

  這 21 筆全在 done feature 裡，代表那些 AC 當初的驗證強度低於報告宣稱的。
  Kairos 已在自己的 ws-328 加 subtask 修既有筆數並加 lint 擋這個寫法。
status: not-started
priority: 1
profile: normal
subtasks:
    - id: define-static-checks
      name: 定義靜態可執行性檢查的邊界（指令可解析、首個 token 是存在的可執行檔、引用的檔案/目錄路徑存在），明確排除實跑 exit code
      status: ""
    - id: precheck-impl
      name: 在 internal/verify 實作 precheck，涵蓋 verify_groups、verify_commands 與 ac_checks
      status: ""
    - id: guard-wire
      name: designing→coding 轉場的 guard 接上 precheck，失敗即退回 designing 並在 escalation 標明失敗指令
      status: ""
    - id: regression-cases
      name: 補測試涵蓋歷史失敗樣態（GOWORK 相對路徑錯、buf lint 路徑錯、ac_ref 誤寫成 YAML 陣列）
      status: ""
    - id: semantic-false-positive
      name: precheck 涵蓋「命令跑得動但驗不到東西」的樣態——grep 未錨定行首而命中 subtest、用分號串接丟棄前段 exit code
      status: ""
rules:
    - 不得在 designing→coding 轉場實跑會產生副作用的指令，也不得以 exit code 非 0 作為判定依據（此時程式碼尚未寫，測試必然失敗）
    - 沿用 internal/verify 既有的 shell 控制字元處理，不另造一套 parser
    - precheck 失敗訊息須指出是哪一條 verify command 與失敗原因
