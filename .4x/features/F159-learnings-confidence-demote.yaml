      name: confidence 欄位/推導與 reinforce 邏輯
      status: ""
    - id: active-demote
      name: active 久未命中自動 demote 與 settings 閾值
      status: ""
    - id: injection-ranking
      name: 注入時排序與 token 上限截斷
      status: ""
rules:
