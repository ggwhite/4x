      status: ""
    - id: ansi-charset-state
      name: ANSI stripper 加 stCharset 狀態處理跨 buffer 的 charset designation
      status: ""
    - id: write-error-propagation
      name: ansiStripper 和 promptStripper 傳播 inner writer 錯誤
