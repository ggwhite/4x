name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  goreleaser:
    name: Build & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[${TAG}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

      - name: Push Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          FORMULA=dist/homebrew/fourx.rb
          if [ ! -f "$FORMULA" ]; then
            echo "::warning::Formula not found at $FORMULA"
            exit 0
          fi
          CONTENT=$(base64 -w0 "$FORMULA")
          SHA=$(gh api repos/ggwhite/homebrew-tap/contents/fourx.rb --jq .sha 2>/dev/null || true)
          ARGS=(--method PUT --field "message=4x ${GITHUB_REF_NAME}" --field "content=$CONTENT")
          if [ -n "$SHA" ]; then
            ARGS+=(--field "sha=$SHA")
          fi
          gh api repos/ggwhite/homebrew-tap/contents/fourx.rb "${ARGS[@]}"

  build-binaries:
    name: Build 4x (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUT="4x-${GOOS}-${GOARCH}${EXT}"
          go build -ldflags "-X main.version=${VERSION}" -o "${OUT}" ./cmd/4x

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 4x-${{ matrix.goos }}-${{ matrix.goarch }}
          path: 4x-${{ matrix.goos }}-${{ matrix.goarch }}*

  macos:
    name: Package macOS .dmg
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      # 匯入 Developer ID Application 憑證到臨時 keychain，供 codesign 使用。
      # 憑證與密碼從 GitHub Secrets 讀取；keychain 密碼在此步驟內臨機產生，不需額外 secret。
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT_PATH"

      # 將 App Store Connect API key（.p8）寫入檔案，供 notarytool 使用。
      - name: Write notarization API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      # 交叉編譯 darwin 通用 binary → 打包 .app/.dmg → Developer ID 簽名 → 公證 → staple。
      - name: Package, sign & notarize .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          make dashboard-release

      - name: Verify universal binary (lipo)
        run: |
          BIN="dist/macos-build/4x Live.app/Contents/MacOS/4x"
          lipo -info "$BIN"
          lipo -archs "$BIN" | grep -q "arm64" && lipo -archs "$BIN" | grep -q "x86_64"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 4x-Live-macos-${{ github.ref_name }}
          path: dist/4x-Live.dmg

      # 清理臨時 keychain 與 API key，避免機密殘留在 runner。
      - name: Clean up signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/certificate.p12"

  windows:
    name: Package Windows .exe
    needs: build-binaries
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download windows binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 4x-windows-amd64
          path: dashboard/tauri/src-tauri/binaries

      - name: Stage sidecar binary
        shell: bash
        run: |
          cd dashboard/tauri/src-tauri/binaries
          mv 4x-windows-amd64.exe 4x-x86_64-pc-windows-msvc.exe

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Generate lockfile
        working-directory: dashboard/tauri/src-tauri
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: dashboard/tauri/src-tauri

      - uses: cargo-bins/cargo-binstall@252c5e70a6eae3a9de06b610159a568eaf705055 # main
      - run: cargo binstall tauri-cli --version "^2" -y

      - name: Tauri build (nsis)
        working-directory: dashboard/tauri
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 4x-Live-windows-${{ github.ref_name }}
          path: dashboard/tauri/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    name: Package Linux .AppImage
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: awalsh128/cache-apt-pkgs-action@16645d024209c15d7936361026bf929212d47393 # latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Download linux binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 4x-linux-amd64
          path: dashboard/tauri/src-tauri/binaries

      - name: Stage sidecar binary
        run: |
          cd dashboard/tauri/src-tauri/binaries
          mv 4x-linux-amd64 4x-x86_64-unknown-linux-gnu
          chmod +x 4x-x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Generate lockfile
        working-directory: dashboard/tauri/src-tauri
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: dashboard/tauri/src-tauri

      - uses: cargo-bins/cargo-binstall@252c5e70a6eae3a9de06b610159a568eaf705055 # main
      - run: cargo binstall tauri-cli --version "^2" -y

      - name: Tauri build (appimage)
        working-directory: dashboard/tauri
        run: cargo tauri build --bundles appimage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 4x-Live-linux-${{ github.ref_name }}
          path: dashboard/tauri/src-tauri/target/release/bundle/appimage/*.AppImage

  attach-desktop:
    name: Attach Desktop to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [goreleaser, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS .dmg
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 4x-Live-macos-${{ github.ref_name }}
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 4x-Live-windows-${{ github.ref_name }}
          path: release

      - name: Download Linux .AppImage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 4x-Live-linux-${{ github.ref_name }}
          path: release

      - name: Rename assets with version
        run: |
          cd release
          TAG="${GITHUB_REF_NAME}"
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "4x-Live-${TAG}-macOS-universal.dmg"; done
          for f in *.exe; do [ -f "$f" ] && mv "$f" "4x-Live-${TAG}-Windows-x64-setup.exe"; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" "4x-Live-${TAG}-Linux-x64.AppImage"; done
          ls -la

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
