<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4x Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{mono:['ui-monospace','SFMono-Regular','Menlo','monospace']}}}}</script>
<style>
  :root {
    --bg-body: #0f0f0f; --bg-card: rgba(24,24,27,.5); --bg-sidebar: #0f0f0f;
    --bg-hover: rgba(39,39,42,.3); --bg-input: rgba(39,39,42,.6);
    --text-1: #e5e5e5; --text-2: #a1a1aa; --text-3: #71717a; --text-4: #52525b;
    --border: rgba(39,39,42,.8); --border-light: rgba(63,63,70,.5);
    --accent: #10b981; --font-content: 15px; --font-code: 13px;
  }
  [data-theme="midnight"] {
    --bg-body: #0a0e1a; --bg-card: rgba(15,23,42,.6); --bg-sidebar: #0a0e1a;
    --bg-hover: rgba(30,41,59,.4); --bg-input: rgba(30,41,59,.6);
    --border: rgba(30,41,59,.8); --border-light: rgba(51,65,85,.5); --accent: #3b82f6;
  }
  [data-theme="noir"] {
    --bg-body: #000; --bg-card: rgba(15,15,15,.8); --bg-sidebar: #000;
    --bg-hover: rgba(25,25,25,.6); --bg-input: rgba(25,25,25,.8);
    --border: rgba(30,30,30,.8); --border-light: rgba(40,40,40,.5); --accent: #a1a1aa;
  }
  [data-theme="frost"] {
    --bg-body: #0f172a; --bg-card: rgba(30,41,59,.5); --bg-sidebar: #0f172a;
    --bg-hover: rgba(51,65,85,.3); --bg-input: rgba(51,65,85,.5);
    --text-1: #e2e8f0; --text-2: #94a3b8; --text-3: #64748b; --text-4: #475569;
    --border: rgba(51,65,85,.6); --border-light: rgba(71,85,105,.4); --accent: #38bdf8;
  }
  [data-theme="light"] {
    --bg-body: #f5f5f5; --bg-card: rgba(255,255,255,.8); --bg-sidebar: #fff;
    --bg-hover: rgba(0,0,0,.04); --bg-input: rgba(0,0,0,.05);
    --text-1: #18181b; --text-2: #3f3f46; --text-3: #71717a; --text-4: #a1a1aa;
    --border: rgba(0,0,0,.08); --border-light: rgba(0,0,0,.06); --accent: #059669;
  }
  [data-theme="paper"] {
    --bg-body: #faf8f5; --bg-card: rgba(255,255,255,.9); --bg-sidebar: #f5f0eb;
    --bg-hover: rgba(0,0,0,.03); --bg-input: rgba(0,0,0,.04);
    --text-1: #1c1917; --text-2: #44403c; --text-3: #78716c; --text-4: #a8a29e;
    --border: rgba(0,0,0,.07); --border-light: rgba(0,0,0,.05); --accent: #b45309;
  }
  body { background: var(--bg-body); color: var(--text-1); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--font-content); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .fade-in { animation: fadeIn .2s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); z-index: 50; display: none; justify-content: center; align-items: flex-start; padding-top: 15vh; }
  .modal-backdrop.open { display: flex; }
  .modal-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 640px; max-height: 70vh; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); backdrop-filter: blur(20px); }
  .search-item { padding: 8px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .1s; }
  .search-item:hover, .search-item.active { background: var(--bg-hover); }
  .search-item.active { border-left: 2px solid var(--accent); }
  .settings-section { padding: 0 24px 20px; }
  .settings-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stepper button { padding: 6px 12px; background: none; border: none; color: var(--text-2); cursor: pointer; font-size: 14px; }
  .stepper button:hover { background: var(--bg-hover); }
  .stepper span { padding: 6px 16px; min-width: 56px; text-align: center; font-size: 13px; color: var(--text-1); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .theme-card { width: 100%; aspect-ratio: 16/10; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; position: relative; overflow: hidden; transition: border-color .15s; }
  .theme-card.selected { border-color: var(--accent); }
  .theme-card .dots { position: absolute; top: 6px; left: 8px; display: flex; gap: 3px; }
  .theme-card .dots span { width: 5px; height: 5px; border-radius: 50%; }
  .theme-card .lines { position: absolute; top: 18px; left: 8px; right: 8px; }
  .theme-card .lines span { display: block; height: 3px; border-radius: 1px; margin-bottom: 3px; }
  #tab-bar { background: var(--bg-sidebar); border-color: var(--border); }
  .tab-item { display: flex; align-items: center; gap: 4px; padding: 4px 12px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap; color: var(--text-4); }
  .tab-item:hover { color: var(--text-2); background: var(--bg-hover); }
  .tab-item.active { color: var(--text-1); border-color: var(--accent); }
  .tab-item .tab-close { opacity: 0; font-size: 14px; line-height: 1; padding: 0 2px; color: var(--text-4); transition: opacity .1s; }
  .tab-item:hover .tab-close { opacity: 1; }
  .tab-item .tab-close:hover { color: var(--text-1); }
</style>
</head>
<body class="min-h-screen">

<!-- Tab Bar -->
<div id="tab-bar" class="flex items-center border-b overflow-hidden" style="min-height:36px">
  <div id="tabs" class="flex items-center overflow-x-auto flex-1 gap-0.5 px-1"></div>
  <button id="add-tab-btn" onclick="showProjectPicker()" class="px-3 py-1.5 text-sm transition-colors" style="color:var(--text-4)" title="Add project">+</button>
</div>

<div class="flex" style="height:calc(100vh - 36px)">

  <!-- Sidebar -->
  <div id="sidebar" class="w-80 border-r overflow-y-auto flex flex-col" style="border-color:var(--border)">
    <div class="p-4 border-b flex items-center gap-2 cursor-pointer transition-colors" style="border-color:var(--border)" onclick="goHome()">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot"></div>
      <h1 class="text-base font-bold tracking-tight">4x Live</h1>
      <span class="text-[10px] ml-auto" style="color:var(--text-4)">Auto-refresh</span>
    </div>
    <div id="task-list" class="flex-1 overflow-y-auto p-2"></div>
  </div>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="header" class="border-b p-4 hidden" style="border-color:var(--border)">
      <div class="flex items-center gap-3">
        <span id="h-id" class="text-sm" style="color:var(--text-4)"></span>
        <span id="h-name" class="font-bold"></span>
        <span id="h-badge" class="ml-auto"></span>
      </div>
      <div id="h-meta" class="flex items-center gap-4 mt-2 text-xs" style="color:var(--text-4)"></div>
    </div>
    <div class="flex-1 overflow-y-auto p-6" id="main">
      <div id="dashboard"></div>
      <div id="messages" class="space-y-4 hidden"></div>
    </div>
  </div>
</div>

<!-- Cmd+K Search -->
<div id="search-modal" class="modal-backdrop" onclick="if(event.target===this)closeSearch()">
  <div class="modal-panel fade-in">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-3)"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="search-input" type="text" placeholder="Search features... (@project to filter)" autocomplete="off"
        style="flex:1;background:none;border:none;outline:none;color:var(--text-1);font-size:15px;font-family:inherit"
        oninput="onSearchInput()" onkeydown="onSearchKey(event)">
    </div>
    <div id="search-results" style="overflow-y:auto;max-height:calc(70vh - 100px)"></div>
    <div style="padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:16px;font-size:11px;color:var(--text-4)">
      <span><kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px">↑↓</kbd> navigate</span>
      <span><kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px">Enter</kbd> select</span>
      <span><kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px">Esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings-modal" class="modal-backdrop" onclick="if(event.target===this)closeSettings()">
  <div class="modal-panel fade-in" style="width:520px;max-height:80vh;overflow-y:auto">
    <div style="padding:20px 24px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)">
      <span style="font-size:16px;font-weight:700">Settings</span>
    </div>
    <div style="padding-top:20px">
      <div class="settings-section">
        <div class="settings-label">Appearance</div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px">Content Font</span>
            <div class="stepper"><button onclick="adjFont('content',-1)">-</button><span id="font-content-val">15px</span><button onclick="adjFont('content',1)">+</button></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px">Code Font</span>
            <div class="stepper"><button onclick="adjFont('code',-1)">-</button><span id="font-code-val">13px</span><button onclick="adjFont('code',1)">+</button></div>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div id="theme-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"></div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Behavior</div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div><span style="font-size:13px">Refresh</span><div style="font-size:11px;color:var(--text-4)">Polling interval</div></div>
          <div class="stepper"><button onclick="adjRefresh(-1)">-</button><span id="refresh-val">3s</span><button onclick="adjRefresh(1)">+</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Project Picker -->
<div id="picker-modal" class="modal-backdrop" onclick="if(event.target===this)closeProjectPicker()">
  <div class="modal-panel fade-in" style="width:520px">
    <div style="padding:20px 24px 16px;border-bottom:1px solid var(--border)">
      <span style="font-size:16px;font-weight:700">Open Project</span>
    </div>
    <div id="recent-list" style="overflow-y:auto;max-height:30vh"></div>
    <div id="browse-panel" style="display:none;border-top:1px solid var(--border)">
      <div id="browse-path" style="padding:8px 24px;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border);font-family:inherit;word-break:break-all"></div>
      <div id="browse-list" style="overflow-y:auto;max-height:35vh"></div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid var(--border)">
      <div style="display:flex;gap:8px">
        <input id="path-input" type="text" placeholder="Enter project path..." autocomplete="off"
          style="flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-1);font-size:13px;font-family:inherit;outline:none"
          onkeydown="if(event.key==='Enter')addProjectFromInput()">
        <button onclick="toggleBrowse()" style="padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer">Browse</button>
        <button id="picker-open-btn" onclick="addProjectFromInput()" style="padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Open</button>
      </div>
      <div id="path-error" style="color:#f87171;font-size:12px;margin-top:6px;display:none"></div>
    </div>
  </div>
</div>

<script>
let projects = [];
let activeProjectId = null;
let openTabs = [];
let allTabTasks = {};
let current = null;
let lastTasks = [];
let lastMsgCount = 0;
let sseSource = null;
let searchIdx = 0;
let searchFiltered = [];
let refreshTimer = null;

function apiBase() { return activeProjectId ? '/api/project/' + activeProjectId : ''; }
function sseBase() { return activeProjectId ? '/sse/project/' + activeProjectId : ''; }
function saveTabState() { localStorage.setItem('4x-tabs', JSON.stringify({ tabs: openTabs, active: activeProjectId })); }
function loadTabState() { try { const s = JSON.parse(localStorage.getItem('4x-tabs') || '{}'); return { tabs: s.tabs || [], active: s.active || null }; } catch { return { tabs: [], active: null }; } }

const DEFAULTS = { theme: 'apple-dark', fontContent: 15, fontCode: 13, refresh: 3 };
let settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('4x-settings') || '{}') };
function saveSettings() { localStorage.setItem('4x-settings', JSON.stringify(settings)); }

const THEMES = [
  { id: 'apple-dark', name: 'Apple Dark', bg: '#0f0f0f', fg: '#e5e5e5', line: '#333' },
  { id: 'midnight',   name: 'Midnight',   bg: '#0a0e1a', fg: '#c8d6e5', line: '#1e3a5f' },
  { id: 'noir',       name: 'Noir',       bg: '#000000', fg: '#a0a0a0', line: '#222' },
  { id: 'frost',      name: 'Frost',      bg: '#0f172a', fg: '#e2e8f0', line: '#334155' },
  { id: 'light',      name: 'Light',      bg: '#f5f5f5', fg: '#18181b', line: '#ddd' },
  { id: 'paper',      name: 'Paper',      bg: '#faf8f5', fg: '#1c1917', line: '#d6cfc7' },
];

function applyTheme(id) {
  settings.theme = id;
  document.documentElement.setAttribute('data-theme', id === 'apple-dark' ? '' : id);
  saveSettings(); renderThemeGrid();
}
function renderThemeGrid() {
  const el = document.getElementById('theme-grid');
  el.innerHTML = THEMES.map(t => `<div style="text-align:center"><div class="theme-card ${settings.theme===t.id?'selected':''}" onclick="applyTheme('${t.id}')" style="background:${t.bg}"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div><div class="lines"><span style="background:${t.line};width:70%"></span><span style="background:${t.line};width:50%"></span><span style="background:${t.line};width:60%"></span></div></div><div style="font-size:11px;color:var(--text-3);margin-top:6px">${t.name}</div></div>`).join('');
}
function applyFont() {
  document.documentElement.style.setProperty('--font-content', settings.fontContent+'px');
  document.documentElement.style.setProperty('--font-code', settings.fontCode+'px');
  document.getElementById('font-content-val').textContent = settings.fontContent+'px';
  document.getElementById('font-code-val').textContent = settings.fontCode+'px';
}
function adjFont(type, delta) {
  if (type==='content') settings.fontContent = Math.min(24, Math.max(12, settings.fontContent+delta));
  else settings.fontCode = Math.min(20, Math.max(10, settings.fontCode+delta));
  saveSettings(); applyFont();
}
function adjRefresh(delta) {
  settings.refresh = Math.min(30, Math.max(1, settings.refresh+delta));
  saveSettings(); document.getElementById('refresh-val').textContent = settings.refresh+'s'; startRefreshTimer();
}
function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (activeProjectId) { load(); if (current) loadMessages(current); } }, settings.refresh*1000);

function renderSearchResults(query) {

  const maxB = Math.max(1, ...Object.values(buckets));
  const rP=total?g.running.length/total:0, pP=total?g.pending.length/total:0, tP=total?g.todo.length/total:0;
  const a1=rP*360, a2=a1+pP*360, a3=a2+tP*360;
  const donut = total ? `conic-gradient(#f59e0b 0deg ${a1}deg,#3b82f6 ${a1}deg ${a2}deg,#a78bfa ${a2}deg ${a3}deg,#10b981 ${a3}deg 360deg)` : 'conic-gradient(#27272a 0deg 360deg)';
  const recent = g.done.slice(-8).reverse();
  const activeTab = openTabs.find(t => t.id === activeProjectId);
  const pName = activeTab ? activeTab.name : '4x Live';
  el.innerHTML = `<div class="flex items-center gap-3 mb-6"><span class="text-lg font-bold">${esc(pName)}</span><span class="ml-auto px-3 py-1 text-xs border border-zinc-700/50 rounded-full text-zinc-400">${total} tasks</span></div>
<div class="grid grid-cols-4 gap-4 mb-8">
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center"><div class="text-3xl font-bold text-amber-400">${g.running.length}</div><div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Running</div></div>
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center"><div class="text-3xl font-bold text-blue-400">${g.pending.length}</div><div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Pending</div></div>
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center"><div class="text-3xl font-bold text-purple-400">${g.todo.length}</div><div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Todo</div></div>
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center"><div class="text-3xl font-bold text-green-400">${g.done.length}</div><div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Done</div></div></div>
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5"><div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Status</div><div class="flex items-center gap-6"><div class="relative w-28 h-28 flex-shrink-0"><div class="w-28 h-28 rounded-full" style="background:${donut}"></div><div class="absolute inset-3 rounded-full bg-zinc-900 flex items-center justify-center flex-col"><span class="text-xl font-bold">${total}</span><span class="text-[10px] text-zinc-500">total</span></div></div><div class="space-y-2 text-xs"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Running<span class="ml-auto text-zinc-400 font-bold">${g.running.length}</span></div><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>Pending<span class="ml-auto text-zinc-400 font-bold">${g.pending.length}</span></div><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>Todo<span class="ml-auto text-zinc-400 font-bold">${g.todo.length}</span></div><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>Done<span class="ml-auto text-zinc-400 font-bold">${g.done.length}</span></div></div></div></div>
<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5"><div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Rounds Distribution</div><div class="space-y-3">${Object.entries(buckets).map(([l,c])=>{const p=maxB?(c/maxB)*100:0;const co={'1':'#10b981','2':'#3b82f6','3-4':'#f59e0b','5+':'#ef4444'};return `<div class="flex items-center gap-3"><span class="text-xs text-zinc-500 w-8 text-right">${l}R</span><div class="flex-1 h-5 bg-zinc-800/50 rounded overflow-hidden"><div class="h-full rounded" style="width:${p}%;background:${co[l]}"></div></div><span class="text-xs font-bold text-zinc-300 w-6 text-right">${c}</span></div>`;}).join('')}</div>${doneTasks.length>0?`<div class="text-[10px] text-zinc-600 mt-3">avg ${(doneTasks.reduce((s,t)=>s+t.round,0)/doneTasks.length).toFixed(1)} rounds/task</div>`:''}</div></div>
${recent.length>0?`<div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5"><div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Recent Completions</div><div class="space-y-2">${recent.map(t=>`<div class="flex items-center gap-3 py-1.5 cursor-pointer hover:bg-zinc-800/30 rounded px-2 -mx-2 transition-colors" onclick="current='${t.id}';load();loadDetail(${JSON.stringify(t).replace(/"/g,'&quot;')})"><span class="text-emerald-500/60 text-xs">✓</span><span class="text-xs font-semibold text-emerald-400/80">${t.id}</span><span class="text-xs text-zinc-400 truncate flex-1">${esc(t.name)}</span>${t.round?`<span class="text-[10px] text-zinc-600">${t.round}R</span>`:''}</div>`).join('')}</div></div>`:''}
${g.running.length>0?`<div class="rounded-xl border border-emerald-500/20 bg-emerald-950/20 p-5 mt-4"><div class="text-[10px] font-bold text-emerald-500/70 uppercase tracking-wider mb-4">Currently Running</div><div class="space-y-2">${g.running.map(t=>`<div class="flex items-center gap-3 py-1.5 cursor-pointer hover:bg-emerald-900/20 rounded px-2 -mx-2 transition-colors" onclick="current='${t.id}';load();loadDetail(${JSON.stringify(t).replace(/"/g,'&quot;')})"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span><span class="text-xs font-semibold text-emerald-400">${t.id}</span><span class="text-xs text-zinc-400 truncate flex-1">${esc(t.name)}</span><span class="text-[10px] text-emerald-400/70">${t.phase||''}</span>${t.round?`<span class="text-[10px] text-zinc-600">R${t.round}</span>`:''}</div>`).join('')}</div></div>`:''}`;
}

async function load() {
  if (!activeProjectId) { renderProjectPicker(); return; }
  const tasks = await (await fetch(apiBase()+'/api/tasks')).json();
  lastTasks = tasks || [];
  const list = document.getElementById('task-list'); list.innerHTML = '';
  const groups = classify(tasks);
  function rg(title, items, count) {
    if (!items.length) return;
    const h = document.createElement('div'); h.className='flex items-center gap-2 px-2 py-2 text-[10px] font-bold text-zinc-500 uppercase tracking-wider'; h.innerHTML=`${title} <span class="ml-auto text-zinc-600">${count}</span>`; list.appendChild(h);
    items.forEach(t => {
      const el = document.createElement('div');
      const isActive = t.active && t.phase && t.phase!=='done', isSel = t.id===current;
      let cls = 'p-3 rounded-lg cursor-pointer mb-1 transition-all duration-150 ';
      if (isActive) cls+='bg-emerald-950/40 border border-emerald-500/20 hover:border-emerald-500/40 ';
      else if (isSel) cls+='bg-zinc-800/80 border border-zinc-700/50 ';
      else if (t.status==='done') cls+='border border-transparent opacity-40 hover:opacity-70 ';
      else cls+='border border-transparent hover:bg-zinc-800/50 ';
      el.className = cls;
      const pi = isActive ? `<div class="flex items-center gap-1.5 mt-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span><span class="text-[11px] text-emerald-400">${t.phase}</span><span class="text-[11px] text-zinc-600">· Round ${t.round||0}</span></div>` : '';
      const di = t.status==='done' ? '<span class="text-emerald-500/60 text-xs">✓</span>' : '';
      el.innerHTML = `<div class="flex items-start gap-2">${di}<div class="flex-1 min-w-0"><div class="text-[13px] font-medium truncate">${t.name}</div><div class="text-[11px] text-zinc-600 mt-0.5">${t.id}</div>${pi}</div></div>`;
      el.onclick = () => { current=t.id; load(); loadDetail(t); };
      list.appendChild(el);
    });
  }
  rg('Running', groups.running, groups.running.length);
  rg('Pending', groups.pending, groups.pending.length);
  rg('Todo', groups.todo, groups.todo.length);
  rg('Done', groups.done, groups.done.length);
  if (!current) renderDashboard(lastTasks);
}

async function loadDetail(t) {
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('messages').innerHTML = ''; lastMsgCount = 0;
  document.getElementById('h-id').textContent = t.id;
  document.getElementById('h-name').textContent = t.name;
  document.getElementById('h-badge').innerHTML = badge(t.status, t.phase, t.active);
  const meta = [];
  if (t.phase) meta.push(`<span>${PHASE_ICON[t.phase]||'○'} ${t.phase}</span>`);
  if (t.round) meta.push(`<span>⟳ Round ${t.round}</span>`);
  if (t.runner) meta.push(`<span>⬡ ${t.runner}</span>`);
  document.getElementById('h-meta').innerHTML = meta.join('<span class="text-zinc-700">·</span>');
  connectSSE(t.id); loadMessages(t.id);
}

function renderMsgCard(m) {
  const r = ROLES[m.role] || {name:m.role,color:'#666',bg:'rgba(100,100,100,.05)'};
  const div = document.createElement('div'); div.className = 'fade-in rounded-lg overflow-hidden';
  div.innerHTML = `<div class="flex items-center gap-2 px-4 py-2" style="background:${r.bg}"><span class="w-1.5 h-1.5 rounded-full" style="background:${r.color}"></span><span class="text-xs font-semibold" style="color:${r.color}">${r.name}</span><span class="text-xs text-zinc-600">${m.label}${m.round?' · Round '+m.round:''}</span></div><div class="px-4 py-3 text-[13px] text-zinc-300 leading-relaxed whitespace-pre-wrap border-l-2" style="border-color:${r.color}20">${esc(m.content.slice(0,3000))}</div>`;
  return div;
}

async function loadMessages(id) {
  const el = document.getElementById('messages'); el.classList.remove('hidden');
  const msgs = await (await fetch(apiBase()+'/api/messages/'+id)).json();
  const list = msgs || [];
  if (list.length === lastMsgCount) return;
  if (list.length < lastMsgCount) { el.innerHTML = ''; lastMsgCount = 0; }
  const empty = el.querySelector('.msg-empty'); if (empty) empty.remove();
  const newMsgs = list.slice(lastMsgCount);
  newMsgs.forEach(m => el.appendChild(renderMsgCard(m)));
  lastMsgCount = list.length;
  if (list.length === 0) el.innerHTML = '<div class="msg-empty text-zinc-600 text-sm mt-8 text-center">No artifacts yet</div>';
  if (newMsgs.length > 0) el.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

async function init() {
  initSettings(); await loadProjects();
  const saved = loadTabState();
  if (saved.tabs.length > 0) { for (const tab of saved.tabs) { if (projects.find(p => p.id === tab.id)) openTabs.push(tab); } activeProjectId = openTabs.find(t => t.id === saved.active) ? saved.active : (openTabs[0] ? openTabs[0].id : null); }
  if (openTabs.length === 0 && projects.length > 0) { projects.forEach(p => openTabs.push({ id: p.id, name: p.name })); activeProjectId = openTabs[0] ? openTabs[0].id : null; }
  saveTabState(); renderTabs();
  if (activeProjectId) load(); else renderProjectPicker();
}
init();
</script>
</body>
</html>
