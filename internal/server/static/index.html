<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4x Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{mono:['ui-monospace','SFMono-Regular','Menlo','monospace']}}}}</script>
<style>
  body { background: #0f0f0f; color: #e5e5e5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .fade-in { animation: fadeIn .2s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen">
<div class="flex h-screen">

  <!-- Sidebar -->
  <div id="sidebar" class="w-80 border-r border-zinc-800/80 overflow-y-auto flex flex-col">
    <div class="p-4 border-b border-zinc-800/80 flex items-center gap-2 cursor-pointer hover:bg-zinc-800/30 transition-colors" onclick="goHome()">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot"></div>
      <h1 class="text-base font-bold tracking-tight">4x Live</h1>
      <span class="text-[10px] text-zinc-600 ml-auto">Auto-refresh</span>
    </div>
    <div id="task-list" class="flex-1 overflow-y-auto p-2"></div>
  </div>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header (feature detail) -->
    <div id="header" class="border-b border-zinc-800/80 p-4 hidden">
      <div class="flex items-center gap-3">
        <span id="h-id" class="text-sm text-zinc-500"></span>
        <span id="h-name" class="font-bold"></span>
        <span id="h-badge" class="ml-auto"></span>
      </div>
      <div id="h-meta" class="flex items-center gap-4 mt-2 text-xs text-zinc-500"></div>
    </div>
    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-6" id="main">
      <div id="dashboard"></div>
      <div id="messages" class="space-y-4 hidden"></div>
    </div>
  </div>
</div>

<script>
let current = null;
let lastTasks = [];
let lastMsgCount = 0;
let sseSource = null;

const ROLES = {
  designer:       { name: 'Designer',     color: '#a855f7', bg: 'rgba(168,85,247,.08)' },
  coder:          { name: 'Coder',        color: '#06b6d4', bg: 'rgba(6,182,212,.08)' },
  reviewer:       { name: 'Reviewer',     color: '#22c55e', bg: 'rgba(34,197,94,.08)' },
  'deep-reviewer':{ name: 'Deep Review',  color: '#22c55e', bg: 'rgba(34,197,94,.08)' },
  tester:         { name: 'Tester',       color: '#f97316', bg: 'rgba(249,115,22,.08)' },
  acceptor:       { name: 'Acceptor',     color: '#eab308', bg: 'rgba(234,179,8,.08)' },
};

const PHASE_ICON = {
  designing: '◆', coding: '◆', reviewing: '◆', testing: '◆',
  accepting: '◆', amending: '◆', done: '✓', blocked: '✕',
  'needs-attention': '!', init: '○', 'not-started': '○'
};

function badge(status, phase, active) {
  if (active && phase && phase !== 'done')
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>In Progress</span>`;
  if (status === 'done')
    return `<span class="px-2 py-0.5 text-[10px] text-zinc-500 border border-zinc-700/50 rounded-full">Done</span>`;
  if (status === 'blocked')
    return `<span class="px-2 py-0.5 text-[10px] text-red-400 border border-red-500/30 rounded-full">Blocked</span>`;
  return `<span class="px-2 py-0.5 text-[10px] text-zinc-600 border border-zinc-800 rounded-full">Backlog</span>`;
}

function goHome() {
  current = null;
  lastMsgCount = 0;
  disconnectSSE();
  document.getElementById('header').classList.add('hidden');
  document.getElementById('messages').classList.add('hidden');
  document.getElementById('messages').innerHTML = '';
  document.getElementById('dashboard').classList.remove('hidden');
  load();
  renderDashboard(lastTasks);
}

function connectSSE(featureId) {
  disconnectSSE();
  sseSource = new EventSource('/sse/events/' + featureId);
  sseSource.onmessage = () => { loadMessages(featureId); };
}

function disconnectSSE() {
  if (sseSource) { sseSource.close(); sseSource = null; }
}

function classify(tasks) {
  const g = { running: [], pending: [], done: [] };
  (tasks || []).forEach(t => {
    const isActive = t.active && t.phase && t.phase !== 'done';
    if (isActive) g.running.push(t);
    else if (t.status === 'done') g.done.push(t);
    else g.pending.push(t);
  });
  return g;
}

function renderDashboard(tasks) {
  const el = document.getElementById('dashboard');
  if (current) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');

  const g = classify(tasks);
  const total = tasks.length;

  // Rounds distribution
  const buckets = { '1': 0, '2': 0, '3-4': 0, '5+': 0 };
  const doneTasks = g.done.filter(t => t.round > 0);
  doneTasks.forEach(t => {
    if (t.round <= 1) buckets['1']++;
    else if (t.round === 2) buckets['2']++;
    else if (t.round <= 4) buckets['3-4']++;
    else buckets['5+']++;
  });
  const maxBucket = Math.max(1, ...Object.values(buckets));

  // Donut chart angles
  const runPct = total ? g.running.length / total : 0;
  const pendPct = total ? g.pending.length / total : 0;
  const donePct = total ? g.done.length / total : 0;
  const a1 = runPct * 360;
  const a2 = a1 + pendPct * 360;
  const donutBg = total
    ? `conic-gradient(#f59e0b 0deg ${a1}deg, #3b82f6 ${a1}deg ${a2}deg, #10b981 ${a2}deg 360deg)`
    : 'conic-gradient(#27272a 0deg 360deg)';

  // Phase distribution for running tasks
  const phases = {};
  g.running.forEach(t => { if (t.phase) phases[t.phase] = (phases[t.phase] || 0) + 1; });

  // Recent completions (show done tasks, newest first by convention)
  const recentDone = g.done.slice(-8).reverse();

  el.innerHTML = `
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <span class="text-lg font-bold">4x Live</span>
      <span class="ml-auto px-3 py-1 text-xs border border-zinc-700/50 rounded-full text-zinc-400">${total} tasks</span>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center">
        <div class="text-3xl font-bold text-amber-400">${g.running.length}</div>
        <div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Running</div>
      </div>
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center">
        <div class="text-3xl font-bold text-blue-400">${g.pending.length}</div>
        <div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Pending</div>
      </div>
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5 text-center">
        <div class="text-3xl font-bold text-green-400">${g.done.length}</div>
        <div class="text-xs text-zinc-500 mt-1 uppercase tracking-wider">Done</div>
      </div>
    </div>

    <!-- Status + Rounds -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <!-- Donut -->
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5">
        <div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Status</div>
        <div class="flex items-center gap-6">
          <div class="relative w-28 h-28 flex-shrink-0">
            <div class="w-28 h-28 rounded-full" style="background:${donutBg}"></div>
            <div class="absolute inset-3 rounded-full bg-zinc-900 flex items-center justify-center flex-col">
              <span class="text-xl font-bold">${total}</span>
              <span class="text-[10px] text-zinc-500">total</span>
            </div>
          </div>
          <div class="space-y-2 text-xs">
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Running<span class="ml-auto text-zinc-400 font-bold">${g.running.length}</span></div>
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>Pending<span class="ml-auto text-zinc-400 font-bold">${g.pending.length}</span></div>
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>Done<span class="ml-auto text-zinc-400 font-bold">${g.done.length}</span></div>
          </div>
        </div>
      </div>

      <!-- Rounds Distribution -->
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5">
        <div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Rounds Distribution</div>
        <div class="space-y-3">
          ${Object.entries(buckets).map(([label, count]) => {
            const pct = maxBucket ? (count / maxBucket) * 100 : 0;
            const colors = { '1': '#10b981', '2': '#3b82f6', '3-4': '#f59e0b', '5+': '#ef4444' };
            return `<div class="flex items-center gap-3">
              <span class="text-xs text-zinc-500 w-8 text-right">${label}R</span>
              <div class="flex-1 h-5 bg-zinc-800/50 rounded overflow-hidden">
                <div class="h-full rounded" style="width:${pct}%;background:${colors[label]}"></div>
              </div>
              <span class="text-xs font-bold text-zinc-300 w-6 text-right">${count}</span>
            </div>`;
          }).join('')}
        </div>
        ${doneTasks.length > 0 ? `<div class="text-[10px] text-zinc-600 mt-3">avg ${(doneTasks.reduce((s,t) => s + t.round, 0) / doneTasks.length).toFixed(1)} rounds/task</div>` : ''}
      </div>
    </div>

    <!-- Recent Completions -->
    ${recentDone.length > 0 ? `
    <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-5">
      <div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-4">Recent Completions</div>
      <div class="space-y-2">
        ${recentDone.map(t => `
          <div class="flex items-center gap-3 py-1.5 cursor-pointer hover:bg-zinc-800/30 rounded px-2 -mx-2 transition-colors" onclick="current='${t.id}';load();loadDetail(${JSON.stringify(t).replace(/"/g, '&quot;')})">
            <span class="text-emerald-500/60 text-xs">✓</span>
            <span class="text-xs font-semibold text-emerald-400/80">${t.id}</span>
            <span class="text-xs text-zinc-400 truncate flex-1">${esc(t.name)}</span>
            ${t.round ? `<span class="text-[10px] text-zinc-600">${t.round}R</span>` : ''}
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Running Details -->
    ${g.running.length > 0 ? `
    <div class="rounded-xl border border-emerald-500/20 bg-emerald-950/20 p-5 mt-4">
      <div class="text-[10px] font-bold text-emerald-500/70 uppercase tracking-wider mb-4">Currently Running</div>
      <div class="space-y-2">
        ${g.running.map(t => `
          <div class="flex items-center gap-3 py-1.5 cursor-pointer hover:bg-emerald-900/20 rounded px-2 -mx-2 transition-colors" onclick="current='${t.id}';load();loadDetail(${JSON.stringify(t).replace(/"/g, '&quot;')})">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
            <span class="text-xs font-semibold text-emerald-400">${t.id}</span>
            <span class="text-xs text-zinc-400 truncate flex-1">${esc(t.name)}</span>
            <span class="text-[10px] text-emerald-400/70">${t.phase || ''}</span>
            ${t.round ? `<span class="text-[10px] text-zinc-600">R${t.round}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>` : ''}
  `;
}

async function load() {
  const tasks = await (await fetch('/api/tasks')).json();
  lastTasks = tasks || [];
  const list = document.getElementById('task-list');
  list.innerHTML = '';

  const groups = classify(tasks);

  function renderGroup(title, items, count) {
    if (items.length === 0) return;
    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 px-2 py-2 text-[10px] font-bold text-zinc-500 uppercase tracking-wider';
    header.innerHTML = `${title} <span class="ml-auto text-zinc-600">${count}</span>`;
    list.appendChild(header);

    items.forEach(t => {
      const el = document.createElement('div');
      const isActive = t.active && t.phase && t.phase !== 'done';
      const isSel = t.id === current;
      let cls = 'p-3 rounded-lg cursor-pointer mb-1 transition-all duration-150 ';
      if (isActive) cls += 'bg-emerald-950/40 border border-emerald-500/20 hover:border-emerald-500/40 ';
      else if (isSel) cls += 'bg-zinc-800/80 border border-zinc-700/50 ';
      else if (t.status === 'done') cls += 'border border-transparent opacity-40 hover:opacity-70 ';
      else cls += 'border border-transparent hover:bg-zinc-800/50 ';
      el.className = cls;

      const phaseInfo = isActive
        ? `<div class="flex items-center gap-1.5 mt-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span><span class="text-[11px] text-emerald-400">${t.phase}</span><span class="text-[11px] text-zinc-600">· Round ${t.round || 0}</span></div>`
        : '';
      const doneIcon = t.status === 'done' ? '<span class="text-emerald-500/60 text-xs">✓</span>' : '';

      el.innerHTML = `
        <div class="flex items-start gap-2">
          ${doneIcon}
          <div class="flex-1 min-w-0">
            <div class="text-[13px] font-medium truncate">${t.name}</div>
            <div class="text-[11px] text-zinc-600 mt-0.5">${t.id}</div>
            ${phaseInfo}
          </div>
        </div>`;
      el.onclick = () => { current = t.id; load(); loadDetail(t); };
      list.appendChild(el);
    });
  }

  renderGroup('Running', groups.running, groups.running.length);
  renderGroup('Pending', groups.pending, groups.pending.length);
  renderGroup('Done', groups.done, groups.done.length);

  if (!current) renderDashboard(lastTasks);
}

async function loadDetail(t) {
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('messages').innerHTML = '';
  lastMsgCount = 0;

  document.getElementById('h-id').textContent = t.id;
  document.getElementById('h-name').textContent = t.name;
  document.getElementById('h-badge').innerHTML = badge(t.status, t.phase, t.active);

  const meta = [];
  if (t.phase) meta.push(`<span>${PHASE_ICON[t.phase] || '○'} ${t.phase}</span>`);
  if (t.round) meta.push(`<span>⟳ Round ${t.round}</span>`);
  if (t.runner) meta.push(`<span>⬡ ${t.runner}</span>`);
  document.getElementById('h-meta').innerHTML = meta.join('<span class="text-zinc-700">·</span>');

  connectSSE(t.id);
  loadMessages(t.id);
}

function renderMsgCard(m) {
  const r = ROLES[m.role] || { name: m.role, color: '#666', bg: 'rgba(100,100,100,.05)' };
  const div = document.createElement('div');
  div.className = 'fade-in rounded-lg overflow-hidden';
  div.innerHTML = `
    <div class="flex items-center gap-2 px-4 py-2" style="background:${r.bg}">
      <span class="w-1.5 h-1.5 rounded-full" style="background:${r.color}"></span>
      <span class="text-xs font-semibold" style="color:${r.color}">${r.name}</span>
      <span class="text-xs text-zinc-600">${m.label}${m.round ? ' · Round ' + m.round : ''}</span>
    </div>
    <div class="px-4 py-3 text-[13px] text-zinc-300 leading-relaxed whitespace-pre-wrap border-l-2" style="border-color:${r.color}20">${esc(m.content.slice(0, 3000))}</div>`;
  return div;
}

async function loadMessages(id) {
  const el = document.getElementById('messages');
  el.classList.remove('hidden');
  const msgs = await (await fetch('/api/messages/' + id)).json();
  const list = msgs || [];

  if (list.length === lastMsgCount) return;

  if (list.length < lastMsgCount) {
    el.innerHTML = '';
    lastMsgCount = 0;
  }

  const empty = el.querySelector('.msg-empty');
  if (empty) empty.remove();

  const newMsgs = list.slice(lastMsgCount);
  newMsgs.forEach(m => el.appendChild(renderMsgCard(m)));
  lastMsgCount = list.length;

  if (list.length === 0) {
    el.innerHTML = '<div class="msg-empty text-zinc-600 text-sm mt-8 text-center">No artifacts yet</div>';
  }

  if (newMsgs.length > 0) {
    el.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
load();
setInterval(() => { load(); if (current) loadMessages(current); }, 3000);
</script>
</body>
</html>
